[package]
name = "educa-brasil"
version = "0.1.0"
edition = "2021"
authors = ["Brenninho"]
description = "Educa Brasil: aulas e quizzes do ensino fundamental"
license = "MIT"

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = false
panic = "abort"

[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
