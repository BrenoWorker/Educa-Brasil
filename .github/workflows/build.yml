name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DX_VERSION: 0.7.10
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: web
          cache-on-failure: true
          cache-all-crates: true
      - name: Cache Dioxus CLI
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx*
          key: dx-${{ runner.os }}-${{ runner.arch }}-${{ env.DX_VERSION }}
      - uses: cargo-bins/cargo-binstall@main
        if: steps.dx-cache.outputs.cache-hit != 'true'
      - name: Install Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo binstall dioxus-cli@${{ env.DX_VERSION }} -y --force
      - run: dx bundle --platform web --release --out-dir out
      - uses: actions/upload-artifact@v4
        with:
          name: EducaBrasil-Web
          path: out/

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            name: Linux-x64
            args: ""
          - os: ubuntu-24.04-arm
            platform: linux
            name: Linux-arm64
            args: --package-types deb
          - os: windows-latest
            platform: windows
            name: Windows-x64
            args: ""
          - os: windows-11-arm
            platform: windows
            name: Windows-arm64
            args: ""
          - os: macos-latest
            platform: macos
            name: macOS-arm64
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev libssl-dev libfuse2
      - uses: mozilla-actions/sccache-action@v0.0.9
        continue-on-error: true
      - name: Disable sccache when unavailable
        shell: bash
        run: command -v sccache >/dev/null || echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}
          cache-on-failure: true
          cache-all-crates: true
      - name: Cache Dioxus CLI
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx*
          key: dx-${{ runner.os }}-${{ runner.arch }}-${{ env.DX_VERSION }}
      - uses: cargo-bins/cargo-binstall@main
        if: steps.dx-cache.outputs.cache-hit != 'true'
      - name: Install Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo binstall dioxus-cli@${{ env.DX_VERSION }} -y --force
      - shell: bash
        run: dx bundle --platform ${{ matrix.platform }} --release --out-dir out ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: EducaBrasil-${{ matrix.name }}
          path: out/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android
          cache-on-failure: true
          cache-all-crates: true
      - name: Cache Dioxus CLI
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx*
          key: dx-${{ runner.os }}-${{ runner.arch }}-${{ env.DX_VERSION }}
      - uses: cargo-bins/cargo-binstall@main
        if: steps.dx-cache.outputs.cache-hit != 'true'
      - name: Install Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo binstall dioxus-cli@${{ env.DX_VERSION }} -y --force
      - name: Bundle arm64 APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          dx bundle --platform android --release --target aarch64-linux-android --package-types apk --out-dir dx-out
      - name: Apply app icon and rebuild APK
        run: |
          APP=target/dx/educa-brasil/release/android/app
          cp -r android/res/. "$APP/app/src/main/res/"
          (cd "$APP" && chmod +x gradlew && ./gradlew assembleDebug --no-daemon)
          mkdir -p out
          cp "$APP"/app/build/outputs/apk/debug/*.apk out/EducaBrasil-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EducaBrasil-Android
          path: out/

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios
          cache-on-failure: true
          cache-all-crates: true
      - name: Cache Dioxus CLI
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx*
          key: dx-${{ runner.os }}-${{ runner.arch }}-${{ env.DX_VERSION }}
      - uses: cargo-bins/cargo-binstall@main
        if: steps.dx-cache.outputs.cache-hit != 'true'
      - name: Install Dioxus CLI
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo binstall dioxus-cli@${{ env.DX_VERSION }} -y --force
      - run: dx bundle --platform ios --release --package-types ios --out-dir dx-out
      - name: Create unsigned IPA
        run: |
          APP=$(find target/dx/educa-brasil/release/ios -maxdepth 1 -name "*.app" | head -1)
          codesign --force --deep --sign - "$APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry EducaBrasil-unsigned.ipa Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: EducaBrasil-iOS
          path: out/
